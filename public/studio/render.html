<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freeze Foundry Studio renderer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #08090b; display: grid; place-items: center; overflow: hidden; }
  canvas { height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
  #state { position: fixed; left: 8px; bottom: 8px; color: #8be0ff; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="state">loading</div>
<script src="shows.js"></script>
<script type="module">
// Makes an episode's video, makes its thumbnail, and hands both back to the server (or, with ?preview=1, just plays it).
// The narration is spoken first, so every scene can last as long as its line. The video is then built frame by
// frame: frame n is drawn at exactly n/30 s and the sound is mixed to the same clock, so picture, captions and voice
// line up by construction, however busy the machine is.
import { Muxer, ArrayBufferTarget } from './vendor/mp4-muxer.mjs';

const q = new URLSearchParams(location.search), id = q.get('ep'), preview = q.has('preview');
const state = s => { document.getElementById('state').textContent = s; document.title = s; };
const api = (p, opts) => fetch(`/api/studio/episodes/${encodeURIComponent(id)}${p}`, opts);
const post = (p, body, type = 'application/json') => api(p, { method: 'POST', headers: { 'Content-Type': type }, body });
const fail = async msg => {
  state('error: ' + msg);
  if (!preview) await post('/render-error', JSON.stringify({ error: String(msg).slice(0, 500) })).catch(() => {});
};
const image = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('could not load ' + src)); i.src = src; });
const FPS = 30, RATE = 48000, T0 = 0.05; // the show's clock starts T0 seconds into the video

try {
  const ep = await api('').then(r => { if (!r.ok) throw new Error('episode not found'); return r.json(); });
  const look = ep.look || ep.show, show = FFStudio.shows[look]; // your own shows are drawn in a built-in look
  if (!show) throw new Error('unknown show ' + ep.show);
  const spec = FFStudio.clean[look](ep.spec);
  if (look !== 'ranked') FFStudio.assets.frostpeak = await image('/img/frostpeak.jpg'); // story shows film the valley

  // Narration: one clip per segment.
  const lines = show.lines(spec), clips = lines.map(() => null), words = lines.map(() => null);
  if (ep.voice && ep.voice.on) {
    const voice = await import('./voice.js');
    await voice.load(p => { if (p.status === 'progress' && p.total) state(`downloading the voice ${Math.round(p.loaded / 1e6)} / ${Math.round(p.total / 1e6)} MB`); });
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i]) continue;
      state(`voice ${i + 1} / ${lines.length}`);
      const a = await voice.speak(lines[i], ep.voice.id, ep.voice.speed);
      clips[i] = new AudioBuffer({ length: a.samples.length, sampleRate: a.rate, numberOfChannels: 1 });
      clips[i].copyToChannel(a.samples, 0);
      words[i] = a.words;
    }
  }
  const tl = show.timeline(spec, clips.map(c => c ? c.duration : 0));
  tl.segs.forEach((s, i) => { s.words = words[i]; }); // when each word is spoken, for the captions
  const dur = tl.duration, frames = Math.ceil((T0 + dur + 0.3) * FPS);
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const at = n => Math.min(dur, Math.max(0, n / FPS - T0)); // show time of frame n

  // Music and narration, through a limiter so a loud line over the music never clips. `start` is when, on the
  // audio context's clock, the show's clock reads zero.
  const voiced = clips.some(Boolean);
  const mix = (ac, dest, start) => {
    const out = ac.createDynamicsCompressor();
    out.threshold.value = -8; out.knee.value = 6; out.ratio.value = 12; out.attack.value = 0.003; out.release.value = 0.2;
    out.connect(dest);
    FFStudio.soundtrack(show.music, ep.id, dur, show.beats(spec, tl))(ac, out, voiced ? 0.4 : 1);
    clips.forEach((buf, i) => {
      if (!buf) return;
      const src = ac.createBufferSource(), g = ac.createGain();
      src.buffer = buf; g.gain.value = 0.85;
      src.connect(g).connect(out); src.start(start + tl.segs[i].say);
    });
  };

  // Plays the show in real time (a timer, not requestAnimationFrame: hidden pages get no animation frames).
  const play = (ac, start) => new Promise(done => {
    const tick = () => {
      const t = Math.max(0, ac.currentTime - start);
      show.draw(ctx, Math.min(t, dur), spec, tl);
      state(`playing ${t.toFixed(1)} / ${dur.toFixed(1)} s`);
      if (t >= dur + 0.3) return done();
      setTimeout(tick, 1000 / FPS);
    };
    tick();
  });

  if (preview) {
    const ac = new AudioContext();
    await ac.resume();
    mix(ac, ac.destination, ac.currentTime + T0);
    await play(ac, ac.currentTime + T0);
    state('done');
  } else {
    const made = await encode() || await recordLive();
    // Thumbnail first: the video upload finishes the episode.
    state('thumbnail');
    const tc = document.createElement('canvas'); tc.width = FFStudio.W; tc.height = FFStudio.H;
    show.thumb(tc.getContext('2d'), spec);
    const jpg = await new Promise(res => tc.toBlob(res, 'image/jpeg', 0.9));
    const tr = await post('/thumb', jpg, 'image/jpeg');
    if (!tr.ok) throw new Error('thumbnail upload failed: ' + tr.status);
    state('uploading');
    const r = await post('/video', made, made.type);
    if (!r.ok) throw new Error('upload failed: ' + r.status);
    state('done');
  }

  // Frame-exact MP4: H.264 video and AAC (or Opus) audio, both stamped on the same clock. Returns null when this
  // browser engine cannot encode H.264, so the live recording takes over.
  async function encode() {
    if (typeof VideoEncoder === 'undefined' || typeof AudioEncoder === 'undefined') return null;
    const W = FFStudio.W, H = FFStudio.H;
    let video = null;
    for (const codec of ['avc1.640033', 'avc1.640028', 'avc1.4d0033']) {
      const c = { codec, width: W, height: H, bitrate: 10_000_000, framerate: FPS, avc: { format: 'avc' } };
      if ((await VideoEncoder.isConfigSupported(c).catch(() => ({}))).supported) { video = c; break; }
    }
    let audio = null;
    for (const codec of ['mp4a.40.2', 'opus']) {
      const c = { codec, sampleRate: RATE, numberOfChannels: 2, bitrate: 160_000 };
      if ((await AudioEncoder.isConfigSupported(c).catch(() => ({}))).supported) { audio = c; break; }
    }
    if (!video || !audio) return null;

    state('mixing the sound');
    const off = new OfflineAudioContext(2, Math.ceil(frames / FPS * RATE), RATE);
    mix(off, off.destination, T0);
    const sound = await off.startRendering();

    const muxer = new Muxer({ target: new ArrayBufferTarget(), fastStart: 'in-memory', firstTimestampBehavior: 'offset',
      video: { codec: 'avc', width: W, height: H, frameRate: FPS }, audio: { codec: audio.codec === 'opus' ? 'opus' : 'aac', numberOfChannels: 2, sampleRate: RATE } });
    let broke = null;
    const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { broke = e; } });
    const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { broke = e; } });
    venc.configure(video);
    aenc.configure(audio);

    const L = sound.getChannelData(0), R = sound.getChannelData(1);
    for (let s = 0; s < sound.length; s += 1024) {
      const n = Math.min(1024, sound.length - s), data = new Float32Array(n * 2);
      data.set(L.subarray(s, s + n), 0); data.set(R.subarray(s, s + n), n);
      const chunk = new AudioData({ format: 'f32-planar', sampleRate: RATE, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(s * 1e6 / RATE), data });
      aenc.encode(chunk); chunk.close();
    }
    for (let n = 0; n < frames; n++) {
      if (broke) throw broke;
      show.draw(ctx, at(n), spec, tl);
      const frame = new VideoFrame(canvas, { timestamp: Math.round(n * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      venc.encode(frame, { keyFrame: n % (2 * FPS) === 0 });
      frame.close();
      if (venc.encodeQueueSize > 8) await new Promise(r => venc.addEventListener('dequeue', r, { once: true }));
      if (n % FPS === 0) state(`drawing ${Math.round(n / frames * 100)}%`);
    }
    await Promise.all([venc.flush(), aenc.flush()]);
    if (broke) throw broke;
    muxer.finalize();
    return new Blob([muxer.target.buffer], { type: 'video/mp4' });
  }

  // Fallback for engines without H.264 encoding: play it once in real time and record that.
  async function recordLive() {
    const ac = new AudioContext();
    await ac.resume();
    const dest = ac.createMediaStreamDestination(), start = ac.currentTime + T0;
    mix(ac, dest, start);
    const stream = canvas.captureStream(FPS);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,opus', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10_000_000, audioBitsPerSecond: 160_000 }), chunks = [];
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.start(1000);
    await play(ac, start);
    const blob = await new Promise(res => { rec.onstop = () => res(new Blob(chunks, { type: type.startsWith('video/mp4') ? 'video/mp4' : 'video/webm' })); rec.stop(); });
    ac.close();
    return blob;
  }
} catch (e) { await fail(e.message || e); }
</script>
</body>
</html>
