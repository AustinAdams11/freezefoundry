<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freeze Foundry Studio renderer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #08090b; display: grid; place-items: center; overflow: hidden; }
  canvas { height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; }
  #state { position: fixed; left: 8px; bottom: 8px; color: #8be0ff; font: 12px ui-monospace, monospace; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="state">loading</div>
<script src="shows.js"></script>
<script type="module">
// Plays an episode and, unless ?preview=1, records it (picture, narration and music), makes its thumbnail, and hands
// both back to the server. The narration is spoken first, so every scene can last as long as its line.
const q = new URLSearchParams(location.search), id = q.get('ep'), preview = q.has('preview');
const state = s => { document.getElementById('state').textContent = s; document.title = s; };
const api = (p, opts) => fetch(`/api/studio/episodes/${encodeURIComponent(id)}${p}`, opts);
const post = (p, body, type = 'application/json') => api(p, { method: 'POST', headers: { 'Content-Type': type }, body });
const fail = async msg => {
  state('error: ' + msg);
  if (!preview) await post('/render-error', JSON.stringify({ error: String(msg).slice(0, 500) })).catch(() => {});
};
const image = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('could not load ' + src)); i.src = src; });

try {
  const ep = await api('').then(r => { if (!r.ok) throw new Error('episode not found'); return r.json(); });
  const show = FFStudio.shows[ep.show];
  if (!show) throw new Error('unknown show ' + ep.show);
  const spec = FFStudio.clean[ep.show](ep.spec);
  if (ep.show === 'frostpeak') FFStudio.assets.frostpeak = await image('/img/frostpeak.jpg');

  // Narration: one clip per segment, spoken before recording starts.
  const audio = new AudioContext();
  const lines = show.lines(spec), clips = lines.map(() => null), marks = lines.map(() => null);
  if (ep.voice && ep.voice.on) {
    const voice = await import('./voice.js');
    await voice.load(p => { if (p.status === 'progress' && p.total) state(`downloading the voice ${Math.round(p.loaded / 1e6)} / ${Math.round(p.total / 1e6)} MB`); });
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i]) continue;
      state(`voice ${i + 1} / ${lines.length}`);
      const a = await voice.speak(lines[i], ep.voice.id, ep.voice.speed);
      const buf = audio.createBuffer(1, a.samples.length, a.rate);
      buf.copyToChannel(a.samples, 0);
      clips[i] = buf;
      marks[i] = a.marks;
    }
  }
  const tl = show.timeline(spec, clips.map(c => c ? c.duration : 0));
  tl.segs.forEach((s, i) => { s.marks = marks[i]; }); // when each sentence is really spoken, for the captions
  const dur = tl.duration;
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');

  await audio.resume();
  const dest = audio.createMediaStreamDestination();
  // Everything goes through a limiter, so a loud line over the music never clips.
  const out = audio.createDynamicsCompressor();
  out.threshold.value = -8; out.knee.value = 6; out.ratio.value = 12; out.attack.value = 0.003; out.release.value = 0.2;
  out.connect(preview ? audio.destination : dest);
  const voiced = clips.some(Boolean);
  FFStudio.soundtrack(show.music, ep.id, dur, show.beats(spec, tl))(audio, out, voiced ? 0.4 : 1);
  const t0 = audio.currentTime + 0.05;
  clips.forEach((buf, i) => {
    if (!buf) return;
    const src = audio.createBufferSource(), g = audio.createGain();
    src.buffer = buf; g.gain.value = 0.85;
    src.connect(g).connect(out); src.start(t0 + tl.segs[i].say);
  });

  let rec, chunks = [];
  if (!preview) {
    const stream = canvas.captureStream(30);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    // MP4 (H.264) when this browser engine can record it: YouTube, TikTok and Instagram all take it. WebM otherwise.
    const type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,opus', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
    rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10_000_000, audioBitsPerSecond: 160_000 });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.start(1000);
  }
  // The audio clock drives the picture, so captions stay on the spoken words. A timer, not requestAnimationFrame:
  // the renderer window is hidden, and hidden pages get no animation frames.
  await new Promise(done => {
    const tick = () => {
      const t = Math.max(0, audio.currentTime - t0);
      show.draw(ctx, Math.min(t, dur), spec, tl);
      state(`${preview ? 'preview' : 'recording'} ${t.toFixed(1)} / ${dur.toFixed(1)} s`);
      if (t >= dur + 0.3) return done();
      setTimeout(tick, 1000 / 30);
    };
    tick();
  });
  if (preview) { state('done'); } else {
    const mime = rec.mimeType.startsWith('video/mp4') ? 'video/mp4' : 'video/webm';
    const blob = await new Promise(res => { rec.onstop = () => res(new Blob(chunks, { type: mime })); rec.stop(); });
    audio.close();
    // Thumbnail first: the video upload finishes the episode.
    state('thumbnail');
    const tc = document.createElement('canvas'); tc.width = FFStudio.W; tc.height = FFStudio.H;
    show.thumb(tc.getContext('2d'), spec);
    const jpg = await new Promise(res => tc.toBlob(res, 'image/jpeg', 0.9));
    const tr = await post('/thumb', jpg, 'image/jpeg');
    if (!tr.ok) throw new Error('thumbnail upload failed: ' + tr.status);
    state('uploading');
    const r = await post('/video', blob, mime);
    if (!r.ok) throw new Error('upload failed: ' + r.status);
    state('done');
  }
} catch (e) { await fail(e.message || e); }
</script>
</body>
</html>
